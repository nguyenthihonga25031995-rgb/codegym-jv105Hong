<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện01 - Bài 6</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }   
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 150px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #ketQua {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<h1>Cấu trúc điều kiện01 - Bài 6</h1>
    <h2>Tính hoa hồng nhận được dựa trên mức doanh số bán hàng.</h2>
    <form>
        <div class="form-group">
            <label for="doanhSo">Nhập doanh số bán hàng:</label>
            <input type="number" id="doanhSo" name="doanhSo" step="0.01" required min="0">
        </div>
        <button type="submit">Tính hoa hồng</button>
        <div id="ketQua"></div>
    </form>
    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault();
            const doanhSo = parseFloat(document.getElementById('doanhSo').value);
            let hoaHong;
            if (doanhSo >= 10000000) {
                hoaHong = doanhSo * 0.1; // 10%
            } else if (doanhSo >= 5000000) {
                hoaHong = doanhSo * 0.07; // 7%
            } else if (doanhSo >= 1000000) {
                hoaHong = doanhSo * 0.05; // 5%
            } else {
                hoaHong = 0;
            }
            document.getElementById('ketQua').textContent = `Hoa hồng nhận được: ${hoaHong.toLocaleString('vi-VN')} VND`;
        });
    </script>   
</body>
</html>
