<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện - Bài 2</title>
    <style>
        .form-group{
            margin-bottom: 16px;
        }
        label{
            display: inline-block;
            width: 150px;
        }
        input[type="number"]{
            width: 200px;
        }
        input[type="submit"]{
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện - Bài 2</h1>
    <p>Nhập ngày tháng năm sinh và kiểm tra xem học sinh đủ tuổi vào lớp 10 hay không</p>
    <form>
        <div class="form-group">
            <label for="day">Ngày sinh:</label>
            <input type="number" id="day" name="day" min="1" max="31" required>
        </div>
        <div class="form-group">
            <label for="month">Tháng sinh:</label>
            <input type="number" id="month" name="month" min="1" max="12" required>
        </div>
        <div class="form-group">
            <label for="year">Năm sinh:</label>
            <input type="number" id="year" name="year" min="1900" max="2026" required>
        </div>
        <div>
            <input type="submit" value="Kiểm tra">
        </div>
    </form>
    <script>
        document.querySelector("form").addEventListener("submit", function(event) {
            event.preventDefault();
            let day = parseInt(document.getElementById("day").value);
            let month = parseInt(document.getElementById("month").value);
            let year = parseInt(document.getElementById("year").value);
            let birthDate = new Date(year, month - 1, day);
            if (birthDate.getDate() !== day || birthDate.getMonth() !== month - 1) {
            alert("Ngày tháng không hợp lệ!");
            return;
            }
            let today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            let monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            if (age >= 16) {
                alert("Học sinh đủ tuổi vào lớp 10.");
            } else {
                alert("Học sinh chưa đủ tuổi vào lớp 10.");
            }
        });
    </script>
</body>
</html>
