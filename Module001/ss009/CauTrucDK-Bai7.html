<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện01 - Bài 7</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }   
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 150px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #117a8b;
        }
        #ketQua {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện01 - Bài 7</h1>
    <h2>Tính cước điện thoại cho một hộ gia đình.</h2>
    <form>
        <div class="form-group">
            <label for="soPhut">Nhập số phút đã sử dụng:</label>
            <input type="number" id="soPhut" name="soPhut" step="1" required min="0">
        </div>
        <button type="submit">Tính cước điện thoại</button>
        <div id="ketQua"></div>
    </form>
    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault();
            const soPhut = parseInt(document.getElementById('soPhut').value);
            let cuocDienThoai;
            if (soPhut <= 50) {
                cuocDienThoai = soPhut * 1000;
            } else if (soPhut <= 100) {
                cuocDienThoai = 50 * 1000 + (soPhut - 50) * 900;
            } else {
                cuocDienThoai = 50 * 1000 + 50 * 900 + (soPhut - 100) * 800;
            }
            document.getElementById('ketQua').textContent = `Cước điện thoại: ${cuocDienThoai.toLocaleString('vi-VN')} VND`;
        });
    </script>
</body>
</html>
