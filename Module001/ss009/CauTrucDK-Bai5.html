<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện01 - Bài 5</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 100px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #ketQua {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện01 - Bài 5</h1>
    <h2>XẾP LOẠI HỌC LỰC CỦA HỌC SINH</h2>
    <form>
        <div class="form-group">
            <label for="diemKT">Nhập điểm Kiểm tra:</label>
            <input type="number" id="diemKT" name="diemKT" step="0.01" required min="0" max="10">
        </div>
         <div class="form-group">
            <label for="diemGK">Nhập điểm thi giữa kỳ:</label>
            <input type="number" id="diemGK" name="diemGK" step="0.01" required min="0" max="10">
        </div>
        <div class="form-group">
                <label for="diemCK">Nhập điểm thi cuối kỳ:</label>
                <input type="number" id="diemCK" name="diemCK" step="0.01" required min="0" max="10">
        </div>
        <button type="submit">Xếp loại</button>
        <div id="ketQua"></div>
    </form>
    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault();
            const diemKT = parseFloat(document.getElementById('diemKT').value);
            const diemGK = parseFloat(document.getElementById('diemGK').value);
            const diemCK = parseFloat(document.getElementById('diemCK').value);
            const diemTB = (diemKT + diemGK*2 + diemCK*3) / 6;
            let xepLoai;

            if (diemTB >= 9) {
                xepLoai = 'Xuất sắc';
            } else if (diemTB >= 8) {
                xepLoai = 'Giỏi';
            } else if (diemTB >= 6.5) {
                xepLoai = 'Khá';
            } else if (diemTB >= 5) {
                xepLoai = 'Trung bình';
            } else {
                xepLoai = 'Yếu';
            }

            document.getElementById('ketQua').textContent = `Điểm trung bình: ${diemTB.toFixed(2)} - Xếp loại: ${xepLoai}`;
        });
    </script>
</body>
</html>
