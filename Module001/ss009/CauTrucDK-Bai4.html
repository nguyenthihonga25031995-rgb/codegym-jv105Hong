<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện01 - Bài 4</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 100px;
            padding: 8px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện - Bài 4</h1>
    <p>Nhập 3 số nguyên, tìm và in ra giá trị lớn nhất trong ba số đó.</p>
    <form>
        <div class="form-group">
        <label for="num1">Số thứ nhất:</label>
        <input type="number" id="num1" name="num1" required>
        </div>
        <div class="form-group">
        <label for="num2">Số thứ hai:</label>
        <input type="number" id="num2" name="num2" required>
        </div>
        <div class="form-group">
        <label for="num3">Số thứ ba:</label>
        <input type="number" id="num3" name="num3" required>
        </div>
        <input type="submit" value="Tìm số lớn nhất">
    </form>
    <div id="result"></div>
    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault();
            const num1 = parseInt(document.getElementById('num1').value);
            const num2 = parseInt(document.getElementById('num2').value);
            const num3 = parseInt(document.getElementById('num3').value);
            let max = num1;
            if (num2 > max) {
                max = num2;
            }
            if (num3 > max) {
                max = num3;
            }   
            document.getElementById('result').textContent = `Số lớn nhất là: ${max}`;
        });
    </script>
</body>
</html>
