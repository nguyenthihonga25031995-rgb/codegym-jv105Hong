<!DOCTYPE html>

    <title>Mảng 2 chiều - Bài 1</title>
</head>
<body>
    <script>
       let a = [
        [1, 2, 1, 24],
        [8, 11, 9, 4],
        [7, 0, 7, 27],
        [7, 4, 28, 14],
        [3, 10, 26, 7]
        ];
        for (let i = 0; i < a.length; i++) {
            for (let j = 0; j < a[i].length; j++) {
                console.log(`a[${i}][${j}]: ${a[i][j]}`);
            }
        }
    </script>
</body>
