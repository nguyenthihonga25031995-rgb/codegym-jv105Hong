    <script>
        let a = prompt("Nhập vào chuỗi thứ nhất: ");
        let b = prompt("Nhập vào chuỗi thứ hai: ");

            console.log("Hai chuỗi giống nhau.");
        } else {
            console.log("Hai chuỗi khác nhau.");
