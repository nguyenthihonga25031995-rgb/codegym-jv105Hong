<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mảng 2 chiều - Bài 3</title>
</head>
<body>
    <script>
        const arr = ['5', '100', '9', 'hello', '42', 'abc', '0', '999'];
        for (let i = 0; i < arr.length; i++) {
            console.log(arr[i]);
        }
        let count = 0;
        for (let i = 0; i < arr.length; i++) {
            if ( arr[i].length === 1 && arr[i] >= '0' && arr[i] <= '9' ) {
                count++;
            }
        }        console.log(`Số phần tử là số từ 0 đến 9: ${count}`);
    </script>
</body>
</html>
