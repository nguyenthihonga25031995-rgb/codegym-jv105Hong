<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chu vi và diện tích hình trò</title>
</head>
<body>
<h1>Chu vi hình tròn</h1>
<script>
    // Lấy bán kính từ người dùng
    let radius = parseFloat(prompt("Nhập bán kính của hình tròn:"));

    // Tính chu vi
    let circumference = 2 * 3.14 * radius;

    // Hiển thị kết quả
    document.write("Chu vi của hình tròn là: " + circumference.toFixed(2)); 
</script>
<h1>Diện tích hình tròn</h1>
<script>
    // Tính diện tích
    let area = 3.14 * radius * radius;

    // Hiển thị kết quả
    document.write("Diện tích của hình tròn là: " + area.toFixed(2));
</script>
</body>
</html>
