<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện 02- Bài 5</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }   
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện 02 - Bài 5</h1>
    <p>Tính diện tích tam giác vuông khi biết 02 cạnh kề a, b.</p>
    <p>Diện tích hình tam giác vuông được tính bằng công thức: S = (a * b) / 2</p>
    <form>
        <div class="form-group">
            <label for="a">Nhập cạnh a:</label>
            <input type="number" id="a" name="a">
        </div>
        <div class="form-group">
            <label for="b">Nhập cạnh b:</label>
            <input type="number" id="b" name="b">
        </div>
        <button type="button" onclick="tinhDienTich()">Tính diện tích</button>
    </form>
    <p id="result"></p>
    <script>
        function tinhDienTich() {
            let a = parseFloat(document.getElementById("a").value);
            let b = parseFloat(document.getElementById("b").value);
            if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) {
                document.getElementById("result").innerText = "Vui lòng nhập đầy đủ và hợp lệ các giá trị.";
            } else {
                let s = (a * b) / 2;
                document.getElementById("result").innerText = "Diện tích hình tam giác vuông là: " + s.toFixed(2);
            }
        }
    </script>
</body>
</html>
