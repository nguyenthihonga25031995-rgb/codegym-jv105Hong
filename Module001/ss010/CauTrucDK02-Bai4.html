<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện 02 - Bài 4</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }   
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện 02 - Bài 4</h1>
    <p>Tính diện tích hình  chữ nhật khi biết 02 cạnh a, b.</p>
    <form>
        <div class="form-group">
        <label for="a">Nhập cạnh a:</label>
        <input type="number" id="a" name="a">
        </div>
        <div class="form-group">
        <label for="b">Nhập cạnh b:</label>
        <input type="number" id="b" name="b">
        </div>
        <button type="button" onclick="tinhDienTich()">Tính diện tích</button>
    </form>
    <p id="result"></p>
    <script>
        function tinhDienTich() {
            let a = document.getElementById("a").value;
            let b = document.getElementById("b").value;
            if (a === "" || b === "") {
                document.getElementById("result").innerText = "Vui lòng nhập cả hai cạnh.";
            } else {
                let s = a * b;
                document.getElementById("result").innerText = "Diện tích hình chữ nhật là: " + s;
            }
        }
    </script>
</body>
</html>
