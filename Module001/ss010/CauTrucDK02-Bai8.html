<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện 02 - Bài 8</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 100px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện 02 - Bài 8</h1>
    <p>Kiểm tra xem một số nhập vào có phải là tuổi của một người không.</p>
    <form>
        <label for="age">Nhập tuổi:</label>
        <input type="number" id="age" name="age">
        <button type="button" onclick="kiemTraTuoi()">Kiểm tra</button>
    </form>
    <p id="result"></p>
    <script>
        function kiemTraTuoi() {
            let age = parseInt(document.getElementById("age").value);
            if (isNaN(age) || age < 0 || age > 120) {
                document.getElementById("result").innerText = "Vui lòng nhập một tuổi hợp lệ (từ 0 đến 120).";
            } else {
                document.getElementById("result").innerText = "Tuổi bạn nhập là: " + age;
            }
        }
    </script>
</body>
</html>
