<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện 02 - Bài 6</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 100px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện 02 - Bài 6</h1>
    <p> Giải phương trình bậc 1: ax + b = 0</p>
    <p>Giải pháp: x = -b / a (với a ≠ 0)</p>
    <form>
        <div class="form-group">
            <label for="a">Nhập hệ số a:</label>
            <input type="number" id="a" name="a">
        </div>
        <div class="form-group">
            <label for="b">Nhập hệ số b:</label>
            <input type="number" id="b" name="b">
        </div>
        <button type="button" onclick="giaiPhuongTrinh()">Giải phương trình</button>
    </form>
    <p id="result"></p>
    <script>
        function giaiPhuongTrinh() {
            let a = parseFloat(document.getElementById("a").value);
            let b = parseFloat(document.getElementById("b").value);
            if (isNaN(a) || isNaN(b) || a === 0) {
                document.getElementById("result").innerText = "Vui lòng nhập đầy đủ và hợp lệ các giá trị.";
            } else {
                let x = -b / a;
                document.getElementById("result").innerText = "Nghiệm của phương trình là: " + x.toFixed(2);
            }
        }
    </script>
</body>
</html>
