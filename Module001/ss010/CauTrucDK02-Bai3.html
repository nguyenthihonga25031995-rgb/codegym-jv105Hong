<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện 02 - Bài 3</title>
</head>
<body>
    <h1>Cấu trúc điều kiện 02 - Bài 3</h1>
    <p>Tính diện tích hình vuông khi biết cạnh a.</p>
    <p>Diện tích hình vuông được tính bằng công thức: S = a * a</p>
    <p>Ví dụ: Nếu a = 5, thì S = 5 * 5 = 25</p>
    <form>
        <label for="a">Nhập cạnh a:</label>
        <input type="number" id="a" name="a">
        <button type="button" onclick="tinhDienTich()">Tính diện tích</button>
    </form>
    <p id="result"></p>
    <script>
        function tinhDienTich() {
            let a = document.getElementById("a").value;
            if (a === "") {
                document.getElementById("result").innerText = "Vui lòng nhập cạnh a.";
            } else {
                let s = a * a;
                document.getElementById("result").innerText = "Diện tích hình vuông là: " + s;
            }
        }
    </script>
</body>
</html>
