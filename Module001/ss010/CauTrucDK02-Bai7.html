<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện 02 - Bài 7</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 100px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện 02 - Bài 7</h1>
    <p> Giải phương trình bậc 2: ax² + bx + c = 0 (a ≠ 0)</p>
    <form>
        <div class="form-group">
            <label for="a">Nhập hệ số a:</label>
            <input type="number" id="a" name="a">
        </div>
        <div class="form-group">
            <label for="b">Nhập hệ số b:</label>
            <input type="number" id="b" name="b">
        </div>
        <div class="form-group">
            <label for="c">Nhập hệ số c:</label>
            <input type="number" id="c" name="c">
        </div>
        <button type="button" onclick="giaiPhuongTrinh()">Giải phương trình</button>
    </form>
    <p id="result"></p>
    <script>
        function giaiPhuongTrinh() {
            let a = parseFloat(document.getElementById("a").value);
            let b = parseFloat(document.getElementById("b").value);
            let c = parseFloat(document.getElementById("c").value);
            if (isNaN(a) || isNaN(b) || isNaN(c)|| a === 0) {
                document.getElementById("result").innerText = "Vui lòng nhập đầy đủ và hợp lệ các giá trị.";
            } else {
                let delta = b * b - 4 * a * c;
                if (delta < 0) {
                    document.getElementById("result").innerText = "Phương trình vô nghiệm.";
                } else if (delta === 0) {
                    let x = -b / (2 * a);
                    document.getElementById("result").innerText = "Phương trình có nghiệm kép: " + x.toFixed(2);
                } else {
                    let x1 = (-b + Math.sqrt(delta)) / (2 * a);
                    let x2 = (-b - Math.sqrt(delta)) / (2 * a);
                    document.getElementById("result").innerText = "Phương trình có hai nghiệm phân biệt: x1 = " + x1.toFixed(2) + ", x2 = " + x2.toFixed(2);
                }
            }
        }
    </script>
</body>
</html>
