<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện 02 - Bài 10</title>
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="number"] {
            width: 100px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Cấu trúc điều kiện 02 - Bài 10</h1>
    <p> Tính giá điện.</p>
    <form>
        <div class="form-group">
            <label for="soDien">Nhập số điện tiêu thụ:</label>
            <input type="number" id="soDien" name="soDien">
        </div>
        <button type="button" onclick="tinhGiaDien()">Tính giá điện</button>
    </form>
    <p id="result"></p>
    <script>
        function tinhGiaDien() {
            let soDien = parseFloat(document.getElementById("soDien").value);
            let giaDien;
            if (isNaN(soDien)) {
                document.getElementById("result").innerText = "Vui lòng nhập số điện tiêu thụ.";
            } else if (soDien <= 50) {
                giaDien = soDien * 1678;
            } else if (soDien <= 100) {
                giaDien = 50 * 1678 + (soDien - 50) * 1734;
            } else {
                giaDien = 50 * 1678 + 50 * 1734 + (soDien - 100) * 2014;
            }
            document.getElementById("result").innerText = "Giá điện phải trả là: " + giaDien.toLocaleString() + " VND";
        }
    </script>
</body>
</html>
