<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu trúc điều kiện - Bài 12</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        p {
            color: #555;
            margin-bottom: 50px;
        }
        .form-group {
            margin-bottom: 15px;
            margin-top: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            margin-top: 10px;
            color: #555;
        }
        input[type="number"] {
            width: 200px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            width: 200px;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Tính lãi suất vay ngân hàng</h2>
        <p>Tính tổng số tiền phải trả theo lãi kép</p>
        <form id="loanForm">
            <div class="form-group">
            <label for="loanAmount">Số tiền vay (VND)</label>
            <input type="number" id="loanAmount" placeholder="100.000.000" required>
            </div>
            <div class="form-group">
            <label for="loanTerm">Thời gian vay (tháng)</label>
            <input type="number" id="loanTerm" placeholder="24" required>
            </div>
            <div class="form-group">
            <label for="interestRate">Lãi suất (%)</label>
            <input type="number" id="interestRate" placeholder="0.8" step="0.01" required>
            </div>
            <button type="button" onclick="calculateLoan()">Tính toán</button>
        </form>
        <div id="result" style="display:none; margin-top:20px;">
        <h2>Kết quả</h2>
        <p id="totalPayment"></p>
        </div>
    </div>  
<script>
    function calculateLoan() {
        const loanAmount = parseFloat(document.getElementById('loanAmount').value);
        const loanTerm = parseInt(document.getElementById('loanTerm').value);
        const interestRate = parseFloat(document.getElementById('interestRate').value) / 100;

        if (isNaN(loanAmount) || isNaN(loanTerm) || isNaN(interestRate)) {
            alert("Vui lòng nhập đầy đủ và hợp lệ các thông tin.");
            return;
        }

        const totalPayment = loanAmount * Math.pow(1 + interestRate, loanTerm);

        document.getElementById('totalPayment').textContent = `Tổng số tiền phải trả: ${formatMoney(Math.round(totalPayment))} VND`;
        document.getElementById('result').style.display = 'block';
    }
    function formatMoney(num) {
        return num.toLocaleString('vi-VN');
    }
</script>
</body>
</html>
