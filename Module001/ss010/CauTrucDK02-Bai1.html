<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu trúc điều kiện 02 - Bài 1</title>
</head>
<body>
    <h1>Cấu trúc điều kiện 02 - Bài 1</h1>
    <p>Chuyển đổi độ C sang độ F </p>
    <form>  
        <label for="celsius">Nhập độ C:</label>  
        <input type="number" id="celsius" name="celsius">  
        <button type="button" onclick="convertToFahrenheit()">Chuyển đổi</button>
    </form>
    <p id="result"></p>
    <script>
        function convertToFahrenheit() {
            let celsius = document.getElementById("celsius").value;
        if (celsius === "") {
            document.getElementById("result").innerText = "Vui lòng nhập độ C.";
        } else {
            let fahrenheit = (celsius * 9/5) + 32;
            document.getElementById("result").innerText = celsius + " độ C bằng " + fahrenheit.toFixed(2) + " độ F.";
        }
        }
    </script>
</body>
</html>
