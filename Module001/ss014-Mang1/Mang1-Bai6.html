<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mảng 1- Bài 6</title>
</head>
<body>
    <script>
        let n = [];
        for (let i = 0; i < 10; i++) {
            n[i] = parseInt(prompt("Nhập phần tử thứ " + (i + 1) + ":"));
        }
        let v = parseInt(prompt("Nhập số cần tìm:"));
        if (n.includes(v)) {
            console.log(v + " is in the array.");
        } else {
            console.log(v + " is not in the array.");
        }
    </script>
</body>
</html>
