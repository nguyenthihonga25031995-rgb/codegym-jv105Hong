<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mảng 1- Bài 4</title>
</head>
<body>
    <script>
        let n = [];
        for (let i = 0; i < 5; i++) {
            n[i] = parseInt(prompt("Nhập phần tử thứ " + (i + 1) + ":"));
        }
        n.reverse();
        console.log("Mảng sau khi đảo ngược là: " + n);
    </script>
</body>
</html>
