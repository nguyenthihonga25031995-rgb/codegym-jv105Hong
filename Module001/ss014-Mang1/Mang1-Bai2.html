<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mảng 1- Bài 2</title>
</head>
<body>
    <script>
        // Bài 2: Tìm phần tử lớn nhất trong mảng
        let n = [];
        for (let i = 0; i < 10; i++) {
            let number = parseInt(prompt("Nhập phần tử thứ " + (i + 1) + ":"));
            if (n.includes(number)) {
                alert("Số đã tồn tại, vui lòng nhập số khác.");
                i--; // Giảm i để người dùng nhập lại phần tử đó
            } else {
                n.push(number);
            }
        }
        let max = n[0];
        for (let i = 1; i < n.length; i++) {
            if (n[i] > max) {
                max = n[i];
            }
        }
        console.log("Phần tử lớn nhất trong mảng là: " + max);
    </script>
</body>
</html>
