<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mảng 1- Bài 8</title>
</head>
<body>
    <script>
        let n = [];
        for (let i = 0; i < 10; i++) {
            n[i] = parseInt(prompt("Nhập phần tử thứ " + (i + 1) + ":"));
        }
        n.sort((a, b) => b - a);
        console.log("Mảng sắp xếp theo thứ tự giảm dần là: " + n);
    </script>
</body>
</html>
