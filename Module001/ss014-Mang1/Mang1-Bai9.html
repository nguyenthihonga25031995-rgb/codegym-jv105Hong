<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mảng 1- Bài 9</title>
</head>
<body>
    <script>
        let a=[];
        let b=[];
        let c=[];
        for(let i=0;i<10;i++){
            a[i]=parseInt(prompt("Nhập phần tử thứ "+(i+1)+" của mảng A:"));
        }
        for(let i=0;i<10;i++){
            b[i]=parseInt(prompt("Nhập phần tử thứ "+(i+1)+" của mảng B:"));
        }
        for(let i=0;i<10;i++){
                c[i]=a[i];
        for(let i=10;i<20;i++){
                c[i]=b[i-10];
            }
        }
        console.log("Mảng C: " + c);
    </script>
</body>
</html>
