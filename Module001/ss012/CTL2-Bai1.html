<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTL2-Bai1</title>
</head>
<body>
<h2> In dãy Fibonacci</h2>
<script>
    function fibonacci(n) {
        if (n <= 0) {
            return [];
        } else if (n === 1) {
            return [0];
        } else if (n === 2) {
            return [0, 1];
        } else {
            const fib = [0, 1];
            for (let i = 2; i < n; i++) {
                fib.push(fib[i - 1] + fib[i - 2]);
            }
            return fib;
        }
    }

    const n = parseInt(prompt("Nhập số lượng phần tử Fibonacci cần in:"));
    const result = fibonacci(n);
    document.write("Dãy Fibonacci: " + result.join(", "));
</script>
</body>
</html>
