<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTL2-Bai4</title>
</head>
<body>
    <h2> In hình chữ nhật</h2>
    <script>
        const rows = parseInt(prompt("Nhập số hàng của hình chữ nhật:"));
        const cols = parseInt(prompt("Nhập số cột của hình chữ nhật:"));
        let rectangle = "";
        for (let i = 1; i <= rows; i++) {
            let line = "";
            for (let j = 1; j <= cols; j++) {
                if (i === 1 || i === rows || j === 1 || j === cols) {
                    line += "* ";
                } else {
                    line += "  ";
                }
            }
            rectangle += line + "\n";
        }
        document.write("<pre>" + rectangle + "</pre>");
    </script>
</body>
</html>
