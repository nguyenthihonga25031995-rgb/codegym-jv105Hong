<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTL2-Bai2</title>
</head>
<body>
    <h2> Tính giai thừa của số nguyên dương n</h2>
    <script>
        function factorial(n) {
            if (n < 0) {
                return "Giai thừa không xác định cho số âm.";
            } else if (n === 0 || n === 1) {
                return 1;
            } else {
                let result = 1;
                for (let i = 2; i <= n; i++) {
                    result = result * i;
                }
                return result;
            }
        }

        const n = parseInt(prompt("Nhập một số nguyên dương để tính giai thừa:"));
        const result = factorial(n);
        document.write("Giai thừa của " + n + " là: " + result);
    </script>
</body>
</html>
