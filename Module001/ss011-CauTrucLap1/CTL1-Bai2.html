<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu trúc lặp - Bài 2</title>
</head>
<body>
    <h2>Cấu trúc lặp - Bài 2</h2>
    <script>
        let temp = parseFloat(prompt("Nhập nhiệt độ (°C):", "0"));
        while (temp <20 || temp > 100) {
            if (temp < 20) {
                alert("Nhiệt độ quá thấp. Vui lòng tăng nhiệt độ.");
            } else {
                alert("Nhiệt độ quá cao. Vui lòng nhập lại.");
            }
            temp = parseFloat(prompt("Nhập lại nhiệt độ (°C):", "0"));
        }
        alert("Nhiệt độ hợp lệ: " + temp + "°C");
    </script>
</body>
</html>
