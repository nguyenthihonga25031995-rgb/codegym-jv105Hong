<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng cửu chương</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h2>Bảng cửu chương</h2>
    <table id="cuuChuong"></table>
    <script>
        const table = document.getElementById('cuuChuong');
        for (let i = 1; i <= 9; i++) {
            const row = table.insertRow();
            for (let j = 2; j <= 9; j++) {
                const cell = row.insertCell();
                cell.textContent = `${j} x ${i} = ${i * j}`;
            }
        }
    </script>
</body>
</html>
