<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu trúc lặp 1</title>
</head>
<body>
    <h2>Cấu trúc lặp 1</h2>
    <p> In ra các số từ 1 đến 100 có điều kiện:</p>
    <script>
        for (let i = 1; i <= 100; i++) {
            if (i % 3 === 0) {
                document.write("Fizz"+ "<br>");
                } else if (i % 5 === 0) {
                document.write("Buzz"+ "<br>");
                } else {
                document.write(i + "<br>");
                }
            }
    </script>
</body>
</html>
