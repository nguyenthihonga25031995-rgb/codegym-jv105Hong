<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mảng 1 Chèn dấu gạch ngang giữa các số chẵn</title>
</head>
<body>
    <script>
        let arr = prompt("Nhập vào một chuỗi số nguyên");
        let result = "";
        for (let i = 0; i < arr.length; i++) {
            result += arr[i];
            if (i < arr.length - 1 && arr[i] % 2 === 0 && arr[i + 1] % 2 === 0) {
                result += "-";
            }
        }
        console.log(result);
    </script>
</body>
</html>
